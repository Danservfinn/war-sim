    good: shell
    annual: 100000
    daily_cap: 277
    remainder: 280
    remainder_is_stock: false
    note: "Capacity. The same sentence's 150 000 is an intention. Not a cap. The page does not state powder origin. powder_local is omitted."
    source: "defenceWeb, Guy Martin, 7 July 2023. Jan-Patrick Helmsen, RDM CEO, told defenceWeb that Boksburg has the capacity to produce 100 000 shells a year. 100000 // 360 = 277, remainder 280. The remainder is not a stock. docs/sources/evidence/defenceweb-rdm-2023-07-07.html https://defenceweb.co.za/editors-pick/rdm-aiming-to-double-production-expand-facilities-as-artillery-demand-soars/"
