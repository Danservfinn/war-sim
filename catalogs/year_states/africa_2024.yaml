# Africa year-state. The year is the year of the steel citations. "Modern" is a label, not a field.
# The loader reads this file only when scenario.yaml lists the path.
# After that load the tick has no civil_year. A national output is not a plant.
# A national output is not a plant. A group total is not a plant cap.
# Remainder after dividing by 360 is not a stock.

