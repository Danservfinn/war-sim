named_empty:
  cells: "No cell was measured. The coast was not drawn. NLS Map Area C16(360) did not open. The page asked for a human check. That check was not clicked. Two other sheets were opened. National Geographic Society, Central Europe and the Mediterranean, as of August 28, 1939, prints Scale 1:5,000,000 or 78.91 miles to the inch. The statute-mile bar is labeled 100, 50, 0, 100, 200, 300. The kilometer bar is labeled 100, 50, 0, 100, 200, 300. Conic projection, standard parallels 34 and 53 degrees. Imprint Washington, October 1939. Fortune, Europe 1939, a map by Harrison, prints a mile bar labeled 0, 50, 100, 200, 300, 400 and a kilometer bar with the same labels. A scale is not a coast."
  stocks: "No pile dated on or before 1939-09-01. Digest tables 73, 75, and 77 date the pile at the end of the period. The earliest monthly stock row is September 1939, after 1 September. USSBS OCR has no commodity on the same line as a number dated on or before that day."
  links: "No cited road or rail names a plant node. A plant with no open link is refused. continent_stocks is not a substitute."
  labor: "No row states a count, a skill, a place, and a date. USSBS table 25, construction employment on 17 May 1939, is a headcount. It is not a skill at a munitions plant."
  formations: "uk_armed_forces_1939_09 is a strength count at the end of September 1939. It does not spawn a unit. League of Nations, Armaments Year-Book, Official No. C.228.M.155.1939.IX, Germany chapter: official documents include no effectives. The unofficial end-of-1938 estimate was not copied. Poland says about 300,000 and gives no date. Not copied. The German navy list is dated August 1939. The columns do not line up. Not copied."
  plants: "No 1939 plant rate with speaker, place, and date. A 1944 or 1945 rate is not a 1939 cap."
  weapons: "No published number. No cited trial."
  orders: "No cited order for 1 September 1939."
  generals: "No page states name, office, and tenure together."
  straits: "catalogs/straits.yaml strings are not locators."
