absent_on_as_of:
  - state: czechoslovakia
    reason: "Last listed president, Emil Dominik Josef Hácha, ends 15 Mar 1939. No later head of state on that page. No protectorate page on the Czechoslovakia index."
    source: "https://www.archontology.org/nations/czechoslovakia/00_1918_39_s.php"
  - state: austria
    reason: "Wilhelm Miklas ends 13 Mar 1938. Arthur Seyss-Inquart is listed for 13 Mar 1938 only. No head of state on 1 Sep 1939 on that page."
    source: "https://www.archontology.org/nations/austria/au_rep1/"

